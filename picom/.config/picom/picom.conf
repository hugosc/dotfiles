# Picom configuration for DWM

# Backend
backend = "glx";
glx-swap-method = 3;

# Sync
vsync = true;

# Frame pacing
use-damage = true;

# Shadows
shadow = true;
shadow-radius = 5;
shadow-opacity = 0.4;
shadow-offset-x = 2;
shadow-offset-y = 2;
shadow-exclude = [
  "class_g = 'dwm'",
  "class_g = 'dmenu'",
  "class_g = 'slock'",
  "class_g = 'melonDS'",
];

# Fading
fading = false;

# Opacity
inactive-opacity = 1.0;
active-opacity = 1.0;
frame-opacity = 1.0;

# Transparency is handled natively by Emacs and st.
# Picom only composites those windows when they request opacity.
opacity-rule = [];

# Blur
blur-background = true;
blur-method = "dual_kawase";
blur-strength = 2;
blur-background-exclude = [
  "class_g = 'dmenu'",
  "class_g = 'melonDS'",
];

blur-background-fixed = false;

# Other
unredir-if-possible = true;
mark-wmwin-focused = true;
use-ewmh-active-window = true;
detect-rounded-corners = true;
detect-client-opacity = true;

# DWM-specific detection
detect-transient = true;
detect-client-leader = true;

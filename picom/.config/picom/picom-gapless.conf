# Picom configuration for DWM - GAPLESS MODE (no shadows)

# Backend
backend = "glx";
glx-swap-method = 3;
xrender-sync-fence = true;

# Sync
vsync = true;
present-method = "glx";

# Frame pacing
use-damage = true;
damage-radius = 1;

# Shadows - DISABLED FOR GAPLESS MODE
shadow = false;

# Fading
fading = false;

# Opacity
inactive-opacity = 1.0;
active-opacity = 1.0;
frame-opacity = 1.0;

# Transparency is handled natively by Emacs and st.
# Picom only composites those windows when they request opacity.
opacity-rule = [];

# Blur
blur-background = true;
blur-method = "dual_kawase";
blur-strength = 2;
blur-background-exclude = [
  "class_g = 'dmenu'",
  "class_g = 'melonDS'",
];

blur-background-fixed = false;

# Other
unredir-if-possible = true;
mark-wmwin-focused = true;
use-ewmh-active-window = true;
detect-rounded-corners = true;
detect-client-opacity = true;

# DWM-specific detection
detect-transient = true;
detect-client-leader = true;

# Start in cover view by default
initial_screen = "library"

# Prefer the HTTPS AP port.
ap_port = 443

# Use "Shift+q" to quit instead of the default "q"
[keybindings]
"Shift+q" = "quit"
"q" = "noop"
# Escape key to quit
"Esc" = "back"
"Backspace" = "noop"

# Replace f1 f3 with 1 2 3
"1" = "queue"
"3" = "library"
"F1" = "noop"
"F3" = "noop"

# Album art (requires ncspot built with `cover` feature)
"m" = "focus cover"

"i" = "focus library"

# Cover view options
cover_max_scale = "1"
